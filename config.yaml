model:
  weights: yolov8m.pt       # yolov8n/s/m/l/x.pt  OR  path to custom .pt
  confidence: 0.25          # lower = catches more vehicles, higher = fewer false positives
  iou: 0.45
  imgsz: 1280               # match video resolution; bigger = catches small/far vehicles
  classes: null             # null = auto-detect vehicle classes from model names
                            # override e.g. [2,3,5,7] for COCO or [0,1,2] for custom

video:
  display: true             # show live window; set false for headless/server

counting:
  line:
    start: null             # e.g. [120, 300] — null triggers interactive draw
    end: null               # e.g. [760, 300]

logging:
  csv_path: counts.csv      # event log; set null to disable
  save_crops: false         # save a cropped image of each counted vehicle
  crops_dir: images
